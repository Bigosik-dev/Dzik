<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styl.css">
    <meta name="author" content="Franciszek, Maciej">
    <title>Dzikie Kasyno</title>
</head>
<body>
    <p class="tytul">Dzikie Kasyno</p>
    <span class="liczby">Rozpocznij grę</span>
    <div class="lives" aria-label="Życia">
        <span class="life">❤️</span>
        <span class="life">❤️</span>
        <span class="life">❤️</span>
    </div>
    <div class="timer">
        <div class="timer-fill"></div>
    </div>
    <span class="timer-percent-label" aria-label="Upływ czasu">0%</span>
    <button class="start">Start</button>
    <img class="dzik" src="foto/dzik.jpg">
    <img class="money-bag" src="foto/bag.png" alt="Worek na monety">
    <div class="score" aria-live="polite">Wynik: <span class="score-value">0</span></div>
    <script src="script.js"></script>
</body>
</html>
